<meta name="claude:viewport-fit-sides" content="cover">
<title>Orlando Pocket Guide</title>
<style>
  /* Layout: phone-first single column; compact header + sticky situation chips + swappable phrase panels */
  :root{
    --bg:#EEF2F0; --card:#FFFFFF; --ink:#13211D; --muted:#5C6E68; --line:#DCE5E1;
    --primary:#0E5C52; --primary-ink:#0E5C52; --primary-soft:#E0EEEA;
    --accent:#CC8A1E; --accent-soft:#F7ECD3;
    --alert:#C24A32; --alert-soft:#F6E2DB;
    --shadow:0 1px 2px rgba(18,40,34,.05), 0 6px 20px rgba(18,40,34,.05);
    --f-display:"Fraunces","Georgia",serif;
    --f-text:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0E1614; --card:#17211E; --ink:#EAF1EE; --muted:#93A49E; --line:#263531;
    --primary:#4CBBAA; --primary-ink:#4CBBAA; --primary-soft:#163029;
    --accent:#E6B257; --accent-soft:#2A2314;
    --alert:#E78469; --alert-soft:#38201A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0E1614; --card:#17211E; --ink:#EAF1EE; --muted:#93A49E; --line:#263531;
    --primary:#4CBBAA; --primary-ink:#4CBBAA; --primary-soft:#163029;
    --accent:#E6B257; --accent-soft:#2A2314;
    --alert:#E78469; --alert-soft:#38201A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-text);line-height:1.5;
    -webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
    background:var(--primary);z-index:20}
  .wrap{max-width:540px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));}

  /* ---------- header ---------- */
  header{background:var(--primary);color:#fff;margin-bottom:0;}
  header .wrap{padding-block:22px 54px}
  .brand{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.82;font-weight:600}
  h1{font-family:var(--f-display);font-weight:600;font-size:clamp(1.9rem,8vw,2.6rem);
    line-height:1.02;margin:.35rem 0 .5rem;text-wrap:balance;letter-spacing:-.01em}
  h1 .sun{color:var(--accent)}
  .hi{font-size:.98rem;max-width:34ch;opacity:.95;margin:0}
  .cake{display:inline-flex;align-items:center;gap:.4rem;margin-top:.9rem;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    padding:.4rem .7rem;border-radius:999px;font-size:.84rem;font-weight:500}

  /* ---------- sticky situation nav ---------- */
  nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);
    border-bottom:1px solid var(--line)}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:12px;
    margin-top:-34px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;
    padding:9px 14px;font:600 .88rem/1 var(--f-text);box-shadow:var(--shadow);
    transition:transform .12s ease}
  .chip svg{width:17px;height:17px;flex:0 0 auto}
  .chip[aria-selected="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
  .chip:active{transform:scale(.96)}
  .chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

  /* ---------- panels ---------- */
  main .wrap{padding-block:18px 40px}
  .panel{display:flex;flex-direction:column;gap:22px}
  .panel[hidden]{display:none!important}
  .group{display:flex;flex-direction:column;gap:11px}
  .g-head{display:flex;flex-direction:column;gap:2px}
  .g-title{font-family:var(--f-display);font-size:1.18rem;font-weight:600;letter-spacing:-.01em}
  .g-note{font-size:.88rem;color:var(--muted)}

  .phrase{background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:14px 15px;box-shadow:var(--shadow);display:grid;gap:7px}
  .cue{font-size:.8rem;color:var(--muted);font-style:italic}
  .cue b{font-style:normal;font-weight:600;color:var(--ink)}
  .en{font-size:1.14rem;font-weight:600;line-height:1.25;letter-spacing:-.005em}
  .say{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
    background:var(--primary-soft);color:var(--primary-ink);border-radius:999px;
    padding:5px 11px;font-size:.84rem;font-weight:600;letter-spacing:.01em}
  .say .lab{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;opacity:.7}

  /* tone variants (role-based) */
  .group.alert .g-title{color:var(--alert)}
  .alert .phrase{background:var(--alert-soft);border-color:transparent}
  .alert .say{background:color-mix(in srgb,var(--alert) 16%,transparent);color:var(--alert)}

  /* calm reminder card */
  .calm{background:var(--accent-soft);border-radius:16px;padding:18px 17px;display:grid;gap:12px}
  .calm h3{font-family:var(--f-display);font-size:1.1rem;font-weight:600;margin:0;color:var(--ink)}
  .calm ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
  .calm li{display:flex;gap:9px;font-size:.95rem;align-items:flex-start}
  .calm li svg{width:17px;height:17px;flex:0 0 auto;margin-top:3px;color:var(--accent)}
  .calm .big{font-weight:600}

  footer{border-top:1px solid var(--line)}
  footer .wrap{padding-block:22px 30px;text-align:center;color:var(--muted);font-size:.86rem}
  footer .sig{font-family:var(--f-display);color:var(--ink);font-size:1.05rem;margin-bottom:3px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">

<header>
  <div class="wrap">
    <div class="brand">English by Neves</div>
    <h1>Your <span class="sun">Orlando</span> Pocket Guide</h1>
    <p class="hi">Everything you need to speak English in Orlando — in your pocket. You've got this. 💪</p>
    <span class="cake">🎂 Happy Birthday & have an amazing trip!</span>
  </div>
</header>

<nav aria-label="Situações">
  <div class="wrap">
    <div class="chips" id="chips" role="tablist"></div>
  </div>
</nav>

<main>
  <div class="wrap">
    <div id="panels"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="sig">Made for you with care ✦</div>
    <div>Ester · English by Neves</div>
  </div>
</footer>

<script>
/* ---------- icons ---------- */
const I = {
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19l1-5.8L3.5 9.1l5.9-.8z"/></svg>',
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13L3 10l2-1.5L11 9l5-6c.9-.9 2.4-.9 2.4.6L15 10l6 2.3-1.3 1.4-5.1-.6-2.2 4.9L11 18z"/></svg>',
  food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v7a2 2 0 002 2h0v8M6 4v6M8 4v6M18 4c-1.5 0-3 2-3 5s1 4 3 4m0-9v16"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 11a2 2 0 01-2 2H9a2 2 0 01-2-2zM9 8V6a3 3 0 016 0v2"/></svg>',
  park:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4"/></svg>',
  bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V7M3 12h15a3 3 0 013 3v3M3 18h18M7 12V9h4v3"/></svg>',
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4zM16 9a4 4 0 010 6M19 7a7 7 0 010 10"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
};

/* ---------- content ---------- */
const DATA = [
  { id:'start', label:'Começar', icon:'star', groups:[
    { title:'As 3 frases mágicas', note:'Com estas você resolve quase tudo. Sempre comece com "Excuse me".',
      items:[
        { en:'Excuse me…', pt:'Com licença… (antes de falar com alguém)', say:'is-quiúz mi' },
        { en:'Can I get ___, please?', pt:'Pode me ver ___? / Posso pedir ___?', say:'quén ái guét ___, plíz' },
        { en:'Where is ___?', pt:'Onde fica ___?', say:'uér iz ___' },
        { en:'How much is this?', pt:'Quanto custa isso?', say:'ráu match iz dís' },
      ]},
    { title:'Quando travar', tone:'alert', note:'Suas frases salva-vidas. Se não entender nada, use estas.',
      items:[
        { en:'Sorry, can you repeat that?', pt:'Desculpa, pode repetir?', say:'sóri, quén iú ripít dét' },
        { en:'Can you speak slowly, please?', pt:'Pode falar devagar?', say:'quén iú spík slôu-li, plíz' },
        { en:"I don't understand.", pt:'Não entendi.', say:'ái dôunt ânder-sténd' },
        { en:'Do you speak Portuguese?', pt:'Você fala português?', say:'du iú spík por-tchu-guíz' },
      ]},
  ]},
  { id:'airport', label:'Aeroporto', icon:'plane', groups:[
    { items:[
        { cue:'Se o oficial perguntar <b>"Purpose of your trip?"</b>, diga:', en:'Tourism. / Vacation.', pt:'Turismo. / Férias.', say:'tú-ri-zãm / vei-kêi-chan' },
        { cue:'Se perguntar <b>"How long will you stay?"</b>, diga:', en:'Ten days.', pt:'Dez dias.', say:'tén dêis' },
        { en:"I'm here on vacation.", pt:'Estou de férias.', say:'áim rír on vei-kêi-chan' },
        { en:'Where is the baggage claim?', pt:'Onde pego as malas?', say:'uér iz dã bé-guidj cleim' },
        { en:'Where is gate B12?', pt:'Onde fica o portão B12?', say:'uér iz gueit bi-tuélv' },
        { en:'I lost my luggage.', pt:'Perdi minha mala.', say:'ái lóst mái lâ-guidj' },
    ]},
  ]},
  { id:'food', label:'Comida', icon:'food', groups:[
    { items:[
        { en:'Can I get a cheeseburger, please?', pt:'Pode me ver um cheeseburger?', say:'quén ái guét a tchíz-bârguer, plíz' },
        { en:'No onions, please.', pt:'Sem cebola, por favor.', say:'nôu â-niâns, plíz' },
        { cue:'Se perguntarem <b>"For here or to go?"</b>:', en:'For here. / To go.', pt:'Pra comer aqui. / Pra viagem.', say:'fór rír / tu góu' },
        { en:'A water, please.', pt:'Uma água, por favor.', say:'a uóder, plíz' },
        { en:'Is this spicy?', pt:'Isso é apimentado?', say:'iz dís spái-ci' },
        { en:'The check, please.', pt:'A conta, por favor.', say:'dã tchék, plíz' },
    ]},
  ]},
  { id:'shop', label:'Compras', icon:'bag', groups:[
    { items:[
        { en:'How much is this?', pt:'Quanto custa isso?', say:'ráu match iz dís' },
        { en:'Do you have this in medium?', pt:'Tem no tamanho M?', say:'du iú rév dís in mí-dium' },
        { en:'Can I try this on?', pt:'Posso experimentar?', say:'quén ái trái dís ón' },
        { en:'Can I pay by card?', pt:'Posso pagar no cartão?', say:'quén ái pêi bái cárd' },
        { en:"I'm just looking, thanks.", pt:'Só olhando, obrigado.', say:'áim djâst lú-kin, thénks' },
    ]},
  ]},
  { id:'parks', label:'Parques', icon:'park', groups:[
    { items:[
        { en:'Where is the line for ___?', pt:'Onde é a fila do ___?', say:'uér iz dã láin for ___' },
        { en:'How long is the wait?', pt:'Quanto tempo de espera?', say:'ráu lóng iz dã uêit' },
        { en:'Where are the restrooms?', pt:'Onde é o banheiro?', say:'uér ar dã réstrums' },
        { en:'Can you take a photo?', pt:'Pode tirar uma foto?', say:'quén iú têik a fôu-tou' },
        { en:'What time does it close?', pt:'Que horas fecha?', say:'uât táim dâz it clôuz' },
        { en:'Where can I buy tickets?', pt:'Onde compro ingresso?', say:'uér quén ái bái tí-kets' },
    ]},
  ]},
  { id:'hotel', label:'Hotel', icon:'bed', groups:[
    { items:[
        { en:'I have a reservation.', pt:'Tenho reserva.', say:'ái rév a re-zer-vêi-chan' },
        { en:"What's the wifi password?", pt:'Qual a senha do wifi?', say:'uâts dã uái-fai pás-uord' },
        { en:'Is breakfast included?', pt:'Café da manhã está incluso?', say:'iz brék-fast in-clú-ded' },
        { en:'Can I have towels, please?', pt:'Pode trazer toalhas?', say:'quén ái rév táu-els, plíz' },
        { en:'What time is checkout?', pt:'Que horas é o checkout?', say:'uât táim iz tchék-aut' },
    ]},
  ]},
];

const CALM = [
  'Everyone in Orlando is used to tourists — they help every day.',
  "You don't need perfect English. People will understand you.",
  'Smile, say "Excuse me", and point if you need to.',
  'Making a mistake is totally okay. Just keep going.',
];

/* ---------- render ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const chips = document.getElementById('chips');
const panels = document.getElementById('panels');

function phraseEl(it){
  const d = document.createElement('div'); d.className='phrase';
  let html='';
  if(it.cue) html+=`<div class="cue">${it.cue}</div>`;
  html+=`<span class="en">${esc(it.en)}</span>`;
  html+=`<span class="say"><span class="lab">diga</span>${esc(it.say.replace(/-/g,''))}</span>`;
  d.innerHTML=html; return d;
}

DATA.forEach((sec,i)=>{
  const chip=document.createElement('button');
  chip.className='chip'; chip.type='button'; chip.role='tab';
  chip.setAttribute('aria-selected', i===0?'true':'false');
  chip.dataset.target=sec.id;
  chip.innerHTML=I[sec.icon]+`<span>${sec.label}</span>`;
  chips.appendChild(chip);

  const panel=document.createElement('section');
  panel.className='panel'; panel.id='p-'+sec.id; panel.setAttribute('role','tabpanel');
  if(i!==0) panel.hidden=true;
  sec.groups.forEach(g=>{
    const grp=document.createElement('div'); grp.className='group'+(g.tone?(' '+g.tone):'');
    if(g.title){
      const h=document.createElement('div'); h.className='g-head';
      h.innerHTML=`<div class="g-title">${g.title}</div>`+(g.note?`<div class="g-note">${g.note}</div>`:'');
      grp.appendChild(h);
    }
    g.items.forEach(it=>grp.appendChild(phraseEl(it)));
    panel.appendChild(grp);
  });
  if(sec.id==='start'){
    const calm=document.createElement('div'); calm.className='calm';
    calm.innerHTML=`<h3>If you feel nervous 🌤️</h3><ul>`+
      CALM.map(c=>`<li>${I.check}<span>${c}</span></li>`).join('')+
      `<li>${I.check}<span class="big">Your magic sentence if you're lost: "Sorry, can you repeat that?"</span></li></ul>`;
    panel.appendChild(calm);
  }
  panels.appendChild(panel);
});

/* ---------- tab switching ---------- */
chips.addEventListener('click', e=>{
  const chip=e.target.closest('.chip'); if(!chip) return;
  [...chips.children].forEach(c=>c.setAttribute('aria-selected', c===chip?'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.hidden = (p.id!=='p-'+chip.dataset.target));
  window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
});
</script>
