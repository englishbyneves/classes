<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Talk Birthdays · English by Neves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2647; --rose:#CF7E93; --rose-soft:#f6e2e7; --teal:#0A7D6E; --teal-2:#12a08c;
  --mint:#DCF0EA; --gold:#E8B84B; --coral:#F58B7B;
  --paper:#fbf5ea; --card:#ffffff; --ink:#2a2f4a; --muted:#7b7f9b; --line:rgba(30,38,71,.10);
  --display:'Playfair Display',Georgia,serif; --body:'Raleway',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(680px 460px at 6% -6%,rgba(207,126,147,.18),transparent 60%),
  radial-gradient(640px 480px at 100% 0%,rgba(18,160,140,.13),transparent 58%),
  radial-gradient(700px 500px at 50% 120%,rgba(232,184,75,.12),transparent 60%),
  linear-gradient(180deg,#fdf8ef,#f6ecdb)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 130px}

header{position:sticky;top:0;z-index:30;background:rgba(251,245,234,.84);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.bar img.logo{height:26px}
.crumb{flex:1;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--rose)}
.homebtn{font-weight:700;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px}
.homebtn:hover{border-color:var(--rose);color:var(--rose)}

h1{font-family:var(--display);font-weight:900;line-height:1.02;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:700}
.kicker{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.lead{color:var(--muted);font-weight:500}

/* hero */
.hero{margin-top:24px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -40px rgba(30,38,71,.4)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(360px) rotate(320deg)}}
.hero .in{position:relative;padding:34px 30px;display:grid;grid-template-columns:1.05fr .95fr;gap:10px;align-items:center}
.hero img.hl{height:30px;margin-bottom:18px}
.hero h1{font-size:clamp(30px,6.6vw,50px)}
.hero h1 em{font-style:italic;color:var(--rose)}
.hero .lead{margin-top:12px;font-size:15px;max-width:34ch}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.badge{font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--mint);color:var(--teal);border:1px solid rgba(10,125,110,.18)}
.badge.g{background:#fbf0d3;color:#b5892a;border-color:rgba(181,137,42,.25)}
.hero .art{display:flex;align-items:center;justify-content:center}
.hero .art svg{width:100%;max-width:270px;height:auto}

/* quick tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.qt{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px;display:flex;align-items:center;gap:14px;transition:.16s}
.qt:hover{transform:translateY(-3px);border-color:var(--rose)}
.qt .e{font-size:28px}
.qt h4{font-family:var(--display);font-size:17px;font-weight:700}
.qt p{font-size:12.5px;color:var(--muted);font-weight:500}

/* activity list */
.actlist{display:grid;gap:12px;margin-top:22px}
.act{cursor:pointer;display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 18px;transition:.15s}
.act:hover{border-color:var(--rose);transform:translateX(3px)}
.act .num{width:34px;height:34px;flex:none;border-radius:11px;background:var(--rose);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--display)}
.act .tx h4{font-size:15.5px;font-weight:700}
.act .tx p{font-size:12.5px;color:var(--muted);font-weight:500}
.act .go{margin-left:auto;color:var(--muted)}

/* sections + cards */
.sectop{margin-top:26px}
.sectop h2{font-size:clamp(23px,4.6vw,31px)}
.sectop .lead{margin-top:6px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;margin-top:18px;box-shadow:0 22px 44px -38px rgba(30,38,71,.4)}
.qlabel{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
.qmain{font-family:var(--display);font-weight:700;font-size:clamp(21px,4.4vw,28px);line-height:1.2;margin-top:8px}
.subq{margin-top:16px;display:grid;gap:8px}
.subq .s{padding:11px 15px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-weight:600;font-size:14.5px}
.subq .s .t{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:2px}
.challenge{margin-top:16px;padding:13px 16px;border-left:3px solid var(--gold);background:#fbf1d6;border-radius:0 12px 12px 0;font-weight:600;font-size:14.5px}
.challenge .t{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#b5892a;display:block;margin-bottom:3px}

/* speak cue + timer */
.speak{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding:11px 14px;border-radius:12px;background:var(--mint);color:var(--navy);border:1px solid rgba(10,125,110,.2)}
.speak .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none;box-shadow:0 0 0 0 rgba(10,125,110,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(207,126,147,.5)}70%{box-shadow:0 0 0 10px rgba(207,126,147,0)}100%{box-shadow:0 0 0 0 rgba(207,126,147,0)}}
.speak .lab{font-size:13px;font-weight:700;flex:1}
.speak .tbtn{font-weight:800;font-size:12.5px;cursor:pointer;border:none;background:var(--teal);color:#fff;padding:8px 14px;border-radius:9px}
.tbar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:9px;overflow:hidden;display:none}
.tbar.on{display:block}.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:6px}
.tcount{font-size:12px;font-weight:800;color:var(--navy);margin-left:auto}

.btn{font-weight:800;font-size:14.5px;cursor:pointer;border:none;border-radius:12px;padding:13px 20px;color:#fff;background:var(--rose);transition:.15s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(1px)}
.btn.teal{background:var(--teal)}.btn.teal:hover{background:var(--teal-2)}
.btn.navy{background:var(--navy)}
.btn.gold{background:var(--gold);color:#4a3410}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--rose);color:var(--rose)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.spacer{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
.chip2{cursor:pointer;font-weight:700;font-size:13px;padding:9px 15px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);transition:.14s}
.chip2:hover{border-color:var(--rose)}
.chip2.sel{background:var(--rose);color:#fff;border-color:var(--rose)}
.chip2.teal.sel{background:var(--teal);border-color:var(--teal)}

.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-top:6px}
.seg button{font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--muted);padding:9px 16px;border-radius:9px}
.seg button.on{background:var(--rose);color:#fff}

/* flashcard */
.flash{perspective:1400px;margin-top:18px}
.flash .inner{position:relative;transition:transform .5s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d;min-height:210px}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:26px 24px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.flash .front{background:linear-gradient(160deg,#fff,#fbf2ec)}
.flash .front .exp{font-family:var(--display);font-size:clamp(21px,4.6vw,28px);font-weight:700;line-height:1.2}
.flash .front .cat{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.flash .back{background:var(--navy);color:#fff;transform:rotateY(180deg)}
.flash .back .r{margin-bottom:13px}
.flash .back .r .t{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rose)}
.flash .back .r .v{font-size:16px;font-weight:600;margin-top:3px}
.flash .back .r.speak-r .v{color:var(--mint)}
.deckhint{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:12px}
.counter{font-size:12.5px;font-weight:700;color:var(--muted)}

.tip{margin-top:14px;padding:13px 16px;border-radius:12px;background:var(--rose-soft);border:1px solid rgba(207,126,147,.28);font-weight:600;font-size:14px;display:none}
.tip.on{display:block}
.tip .t{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rose);display:block;margin-bottom:4px}

/* this or that */
.tot{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:18px}
.tot .opt{cursor:pointer;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;transition:.15s;min-height:96px;display:flex;align-items:center;justify-content:center}
.tot .opt:hover{border-color:var(--rose)}
.tot .opt.sel{background:var(--rose);color:#fff;border-color:var(--rose)}
.tot .vs{font-family:var(--display);font-weight:800;color:var(--muted);font-size:15px}

/* combo */
.combo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.combo .c{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center}
.combo .c .t{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.combo .c .v{font-family:var(--display);font-weight:700;font-size:16px;margin-top:6px;color:var(--navy);min-height:42px;display:flex;align-items:center;justify-content:center}

/* builder */
.block{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin-top:12px}
.block .bt{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.block p{font-weight:600;font-size:14.5px;margin-top:5px}
.model{margin-top:16px;padding:15px 18px;border-radius:12px;background:var(--mint);border:1px solid rgba(10,125,110,.16)}
.model .t{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.model p{font-weight:600;font-size:14.5px;color:var(--navy)}
.mockdots{display:flex;gap:7px;margin-top:16px}
.mockdots i{height:8px;flex:1;border-radius:5px;background:var(--line)}
.mockdots i.on{background:var(--teal)}.mockdots i.now{background:var(--rose)}

.progress{height:4px;background:rgba(30,38,71,.08)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--teal));transition:width .45s cubic-bezier(.22,1,.36,1);border-radius:0 4px 4px 0}
.flowbar{display:flex;align-items:center;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.startrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hide{display:none!important}.center{text-align:center}
.foot{text-align:center;margin-top:44px;opacity:.6}.foot img{height:20px}
@media(max-width:680px){.hero .in{grid-template-columns:1fr}.hero .art{order:-1;max-width:220px;margin:0 auto}.tiles{grid-template-columns:1fr}.tot{grid-template-columns:1fr;gap:8px}.tot .vs{display:none}.combo{grid-template-columns:1fr}}
</style>
</head>

    '<div class="kicker" style="margin-top:18px;color:var(--muted)">Filter by type</div><div class="chips" style="margin-top:8px">'+catBtns+'</div><div id="deckWrap"></div>'+navRow('home','talk');
  renderCard();};
function deckCat(i){dS.cat=i;dS.i=0;document.querySelectorAll('#stage .chips .chip2').forEach(function(c,k){c.classList.toggle('sel',k===i);});renderCard();}
function curCards(){return DECK[dS.cats[dS.cat]];}
function renderCard(){var arr=curCards();var c=arr[dS.i];dS.ex=0;
  document.getElementById('deckWrap').innerHTML=
  '<div class="flash" id="flash" onclick="flip()"><div class="inner">'+
   '<div class="face front"><div class="cat">'+dS.cats[dS.cat]+'</div><div class="exp">'+c.e+'</div><div class="deckhint">Tap to reveal meaning &amp; examples</div></div>'+
   '<div class="face back"><div class="r"><div class="t">Meaning</div><div class="v">'+c.m+'</div></div>'+
     '<div class="r"><div class="t">Example</div><div class="v" id="exText">'+c.x[0]+'</div></div>'+
     '<div class="r speak-r"><div class="t">Your turn</div><div class="v">Say it, then use it in a sentence about you.</div></div></div>'+
  '</div></div>'+
  '<div class="btnrow"><span class="counter">'+(dS.i+1)+' / '+arr.length+'</span><span class="spacer"></span>'+
   '<button class="btn ghost" onclick="event.stopPropagation();anotherEx()">Another example</button>'+
   '<button class="btn" onclick="event.stopPropagation();nextCard()">Next phrase →</button></div>';}
function flip(){document.getElementById('flash').classList.toggle('flipped');}
function anotherEx(){var c=curCards()[dS.i];dS.ex=(dS.ex+1)%c.x.length;var f=document.getElementById('flash');if(!f.classList.contains('flipped'))f.classList.add('flipped');document.getElementById('exText').textContent=c.x[dS.ex];}
function nextCard(){var arr=curCards();dS.i=(dS.i+1)%arr.length;renderCard();}

/* talk */
var tkS={i:0};
VIEWS.talk=function(){tkS.i=0;crumb('<b>Round 3</b> · Talk About Your Birthday');
  stage.innerHTML=sec('Round 3','Talk About Your Birthday','Your real life this time. Use the support only if you need it — aim for 30–60 seconds each.')+
   '<div class="card" id="tkc"></div>'+navRow('home','expect');renderTalk();};
function renderTalk(){var c=TALK[tkS.i];document.getElementById('tkc').innerHTML='<div class="qlabel">Card '+(tkS.i+1)+' of '+TALK.length+'</div><div class="qmain">'+c.q+'</div>'+
  '<div class="tip" id="tktip"><span class="t">Support</span>'+c.s.join(' &nbsp;·&nbsp; ')+'</div>'+speakCue('Speak for 30–60 seconds about you.')+
  '<div class="btnrow"><button class="btn ghost" onclick="document.getElementById(\'tktip\').classList.toggle(\'on\')">Show support</button><span class="spacer"></span><button class="btn" onclick="talkNext()">Next card →</button></div>';}
function talkNext(){tkS.i=(tkS.i+1)%TALK.length;renderTalk();}

/* expectations */
var exMode='q';
VIEWS.expect=function(){crumb('<b>Round 4</b> · Expectations vs Reality');exMode='q';
  stage.innerHTML=sec('Round 4','Expectations vs Reality','First, what you hope for. Then, what actually happens…')+
   '<div class="seg"><button id="segQ" class="on" onclick="expSeg(\'q\')">Your expectations</button><button id="segS" onclick="expSeg(\'s\')">Expectation vs reality</button></div>'+
   '<div class="card" id="exc"></div>'+navRow('home','tot');expRender();};
function expSeg(m){exMode=m;document.getElementById('segQ').classList.toggle('on',m==='q');document.getElementById('segS').classList.toggle('on',m==='s');expRender();}
function expRender(){var el=document.getElementById('exc');
  if(exMode==='q'){el.innerHTML='<div class="qlabel">What do you expect?</div><div class="qmain">'+rand(EXPECT_Q)+'</div>'+speakCue('Answer out loud.')+'<div class="btnrow"><button class="btn" onclick="expRender()">Another question →</button></div>';}
  else{var o=rand(EXPECT_SIT);el.innerHTML='<div class="qlabel">Expectation… vs reality</div><div class="qmain">'+o.s+'</div>'+
    '<div class="challenge"><span class="t">Speak</span>How would you feel? What would you actually say?</div>'+
    '<div class="tip" id="extip"><span class="t">One natural reaction</span>“'+o.r+'”</div>'+speakCue('React out loud first — then reveal.')+
    '<div class="btnrow"><button class="btn ghost" onclick="document.getElementById(\'extip\').classList.toggle(\'on\')">Reveal a reaction</button><span class="spacer"></span><button class="btn" onclick="expRender()">Next one →</button></div>';}}

/* this or that */
var totS={i:0};
VIEWS.tot=function(){totS.i=0;crumb('<b>Round 5</b> · This or That');
  stage.innerHTML=sec('Round 5','This or That','Pick a side — quickly. Then defend your choice out loud.')+
   '<div class="card" id="totc"></div>'+navRow('home','prob');renderTot();};
function renderTot(){var p=TOT[totS.i];document.getElementById('totc').innerHTML='<div class="qlabel">Choice '+(totS.i+1)+' of '+TOT.length+'</div>'+
  '<div class="tot"><div class="opt" onclick="totPick(this)">'+p[0]+'</div><div class="vs">vs</div><div class="opt" onclick="totPick(this)">'+p[1]+'</div></div>'+
  '<div id="totFollow" class="hide">'+speakCue('Say why — give a real reason.')+'</div>'+
  '<div class="btnrow"><span class="spacer"></span><button class="btn" id="totNext" onclick="totNext()" style="display:none">Next choice →</button></div>';}
function totPick(el){var opts=el.parentElement.querySelectorAll('.opt');opts.forEach(function(o){o.classList.remove('sel');});el.classList.add('sel');
  document.getElementById('totFollow').classList.remove('hide');document.getElementById('totNext').style.display='inline-block';}
function totNext(){totS.i=(totS.i+1)%TOT.length;renderTot();}

/* problems */
var prS={i:0};
VIEWS.prob=function(){prS.i=0;crumb('<b>Round 6</b> · Birthday Problems');
  stage.innerHTML=sec('Round 6','Birthday Problems','One awkward moment at a time. Say your response first, then tap for language.')+
   '<div class="card" id="prc"></div>'+navRow('home','gift');renderProb();};
function renderProb(){var p=PROBLEMS[prS.i];var keys=Object.keys(PSUPPORT);
  document.getElementById('prc').innerHTML='<div class="qlabel">Problem '+(prS.i+1)+' of '+PROBLEMS.length+'</div><div class="qmain">'+p+'</div>'+speakCue('React out loud.')+
   '<div class="chips" style="margin-top:16px">'+keys.map(function(k){return '<span class="chip2" onclick="showPS(this,\''+k.replace(/'/g,"\\'")+'\')">'+k+'</span>';}).join('')+'</div>'+
   '<div class="tip" id="prtip"></div><div class="btnrow"><span class="spacer"></span><button class="btn" onclick="probNext()">Next problem →</button></div>';}
function showPS(el,k){document.querySelectorAll('#prc .chip2').forEach(function(c){c.classList.remove('sel');});el.classList.add('sel');var t=document.getElementById('prtip');t.innerHTML='<span class="t">'+k+'</span>'+PSUPPORT[k].join(' &nbsp;·&nbsp; ');t.classList.add('on');}
function probNext(){prS.i=(prS.i+1)%PROBLEMS.length;renderProb();}

/* gift */
var gMode='spin';
VIEWS.gift=function(){crumb('<b>Round 7</b> · Gift Talk');gMode='spin';
  stage.innerHTML=sec('Round 7','Gift Talk','Play gift-buyer, then share your real opinions on presents.')+
   '<div class="seg"><button id="gA" class="on" onclick="giftSeg(\'spin\')">Who gets what?</button><button id="gB" onclick="giftSeg(\'op\')">Your opinions</button></div>'+
   '<div class="card" id="gc"></div>'+navRow('home','final');giftRender();};
function giftSeg(m){gMode=m;document.getElementById('gA').classList.toggle('on',m==='spin');document.getElementById('gB').classList.toggle('on',m==='op');giftRender();}
function giftRender(){var el=document.getElementById('gc');
  if(gMode==='spin'){el.innerHTML='<div class="combo"><div class="c"><div class="t">Person</div><div class="v" id="gP">—</div></div><div class="c"><div class="t">Budget</div><div class="v" id="gB2">—</div></div><div class="c"><div class="t">Occasion</div><div class="v" id="gO">—</div></div></div>'+
    '<div class="center" style="margin-top:16px"><button class="btn" onclick="giftSpin()">🎁 Spin the gift challenge</button></div><div id="gBody" class="hide"></div>';}
  else{el.innerHTML='<div class="qlabel">Gift opinions</div><div class="qmain">'+rand(GIFT_Q)+'</div>'+speakCue('Answer out loud, with an example.')+'<div class="btnrow"><button class="btn" onclick="giftRender()">Another question →</button></div>';}}
function giftSpin(){var n=0;var iv=setInterval(function(){document.getElementById('gP').textContent=rand(GIFT_PPL);document.getElementById('gB2').textContent=rand(GIFT_BUDGET);document.getElementById('gO').textContent=rand(GIFT_OCC);n++;
  if(n>=14){clearInterval(iv);document.getElementById('gBody').classList.remove('hide');document.getElementById('gBody').innerHTML='<div class="challenge"><span class="t">Speak</span>What would you get them, and why? Would it be easy or hard to choose?</div>'+speakCue('Explain your gift out loud.')+'<div class="btnrow"><button class="btn" onclick="giftSpin()">New challenge →</button></div>';}},80);}

/* final */
var fMode='dream',dreamI=0,stI=0;
VIEWS.final=function(){crumb('<b>Finale</b> · The Big Finale');fMode='dream';dreamI=0;stI=0;
  stage.innerHTML=sec('Grand finale','The Big Finale','Two ways to finish: design your dream birthday, or tell a real birthday story.')+
   '<div class="seg"><button id="fA" class="on" onclick="finSeg(\'dream\')">Dream birthday</button><button id="fB" onclick="finSeg(\'story\')">Birthday story</button></div>'+
   '<div class="card" id="fc"></div>'+navRow('home','home');finRender();};
function finSeg(m){fMode=m;dreamI=0;stI=0;document.getElementById('fA').classList.toggle('on',m==='dream');document.getElementById('fB').classList.toggle('on',m==='story');finRender();}
function finRender(){var el=document.getElementById('fc');
  if(fMode==='dream'){var d=DREAM[dreamI];var dots=DREAM.map(function(_,k){return '<i class="'+(k<dreamI?'on':(k===dreamI?'now':''))+'"></i>';}).join('');
    el.innerHTML='<div class="qlabel">Design it · '+(dreamI+1)+' of '+DREAM.length+'</div><div class="block"><div class="bt">'+d.t+'</div><p>'+d.q+'</p></div><div class="mockdots">'+dots+'</div>'+
     speakCue('Say your answer for this part.')+
     '<div class="btnrow">'+(dreamI<DREAM.length-1?'<button class="btn" onclick="dreamNext()">Next part →</button>':'<button class="btn" onclick="dreamDone()">Now describe the whole thing ✓</button>')+'</div>';}
  else{var dots2=STORY_STEPS.map(function(_,k){return '<i class="'+(k<stI?'on':(k===stI?'now':''))+'"></i>';}).join('');
    el.innerHTML='<div class="qlabel">Your story · '+(stI+1)+' of '+STORY_STEPS.length+'</div><div class="qmain">'+STORY_STEPS[stI]+'</div><div class="mockdots">'+dots2+'</div>'+
     speakCue('Tell this part of the story out loud.')+
     '<div class="btnrow">'+(stI<STORY_STEPS.length-1?'<button class="btn" onclick="storyNext()">Next part →</button>':'<button class="btn" onclick="storyDone()">Now tell it all together ✓</button>')+'</div>';}}
function dreamNext(){if(dreamI<DREAM.length-1){dreamI++;finRender();}}
function dreamDone(){document.getElementById('fc').innerHTML='<div class="qmain">Brilliant — now describe your whole dream birthday in one go. 🎉</div><div class="model"><div class="t">Model shape</div><p>My dream birthday would be… &nbsp;·&nbsp; I\'d be with… &nbsp;·&nbsp; We\'d have… &nbsp;·&nbsp; The one thing I\'d need is…</p></div>'+speakCue('Full description — aim for a minute.')+'<div class="btnrow"><button class="btn ghost" onclick="finSeg(\'dream\')">Start again</button><button class="btn navy" onclick="nav(\'home\')">Finish 🎉</button></div>';}
function storyNext(){if(stI<STORY_STEPS.length-1){stI++;finRender();}}
function storyDone(){document.getElementById('fc').innerHTML='<div class="qmain">Lovely — now tell the whole story, start to finish. 🎂</div>'+speakCue('Full story, ~45–60 seconds.')+'<div class="btnrow"><button class="btn ghost" onclick="finSeg(\'story\')">Another story</button><button class="btn navy" onclick="nav(\'home\')">Finish 🎉</button></div>';}

/* random */
VIEWS.randomQ=function(){crumb('Surprise question');
  var pool=QUICKFIRE.concat(EXPECT_Q,GIFT_Q,TALK.map(function(t){return t.q;}));
  stage.innerHTML=sec('Warm-up','Surprise Question','One random birthday question. Answer, then spin again.')+
   '<div class="card" id="rq"></div><div class="btnrow" style="justify-content:center"><button class="btn ghost" onclick="nav(\'home\')">← Home</button></div>';
  window._rqpool=pool;rqOne();};
function rqOne(){document.getElementById('rq').innerHTML='<div class="qlabel">Question</div><div class="qmain">'+rand(window._rqpool)+'</div>'+speakCue('Answer out loud.')+'<div class="btnrow"><button class="btn" onclick="rqOne()">🎲 Another →</button></div>';}

nav('home');
</script>
</body>
</html>
